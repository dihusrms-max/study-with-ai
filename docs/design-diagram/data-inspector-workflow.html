<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Data Inspector 작업 흐름</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    :root {
      --paper: #f5f5f5;
      --paper-2: #ececec;
      --ink: #2d3142;
      --muted: #4f5d75;
      --soft: #7a8399;
      --rule: rgba(45, 49, 66, 0.16);
      --accent: #eb6c36;
      --accent-tint: rgba(235, 108, 54, 0.08);
      --font-sans: 'Geist', 'Noto Sans KR', system-ui, sans-serif;
      --font-serif: 'Instrument Serif', 'Noto Serif KR', serif;
      --font-mono: 'Geist Mono', ui-monospace, monospace;
    }
    body {
      margin: 0;
      min-height: 100vh;
      padding: 48px 32px;
      background: var(--paper);
      color: var(--ink);
      font-family: var(--font-sans);
    }
    .frame { width: min(1280px, 100%); margin: 0 auto; }
    .eyebrow {
      margin: 0 0 8px;
      color: var(--muted);
      font: 500 8px/1 var(--font-mono);
      letter-spacing: .18em;
      text-transform: uppercase;
    }
    h1 {
      margin: 0 0 24px;
      font: 400 clamp(28px, 3vw, 40px)/1.1 var(--font-serif);
      letter-spacing: -.02em;
    }
    .note {
      margin: 16px 0 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.6;
    }
    svg { display: block; width: 100%; height: auto; }
    .lane-label { font: 600 12px var(--font-sans); fill: var(--ink); }
    .lane-hint { font: 400 9px var(--font-mono); fill: var(--soft); }
    .step-label { font: 500 8px var(--font-mono); letter-spacing: .12em; fill: var(--muted); }
    .node-title { font: 600 12px var(--font-sans); fill: var(--ink); }
    .node-sub { font: 400 9px var(--font-mono); fill: var(--soft); }
    .legend-label { font: 500 8px var(--font-mono); letter-spacing: .12em; fill: var(--soft); }
    .legend-text { font: 400 9px var(--font-sans); fill: var(--muted); }
  </style>
</head>
<body>
  <main class="frame">
    <p class="eyebrow">PROCESS · DATA INSPECTOR</p>
    <h1>데이터 결합 전 검사와 승인 흐름</h1>

    <svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="data-inspector-workflow-title data-inspector-workflow-desc">
      <title id="data-inspector-workflow-title">Data Inspector 작업 흐름</title>
      <desc id="data-inspector-workflow-desc">원본 데이터 확인부터 구조 진단, 사용자 승인, 결합 실행과 검증까지의 안전한 데이터 검사 흐름을 보여주는 프로세스 다이어그램.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="1280" height="720" fill="#f5f5f5"/>
      <rect x="0" y="0" width="1280" height="36" fill="#ececec"/>
      <text x="40" y="23" class="step-label">INSPECT · VALIDATE · DEFINE · PLAN · APPROVE · VERIFY</text>

      <!-- Lane guides -->
      <line x1="40" y1="116" x2="1240" y2="116" stroke="rgba(45,49,66,.12)"/>
      <line x1="40" y1="256" x2="1240" y2="256" stroke="rgba(45,49,66,.12)"/>
      <line x1="40" y1="396" x2="1240" y2="396" stroke="rgba(45,49,66,.12)"/>
      <text x="40" y="96" class="lane-label">사용자</text>
      <text x="40" y="108" class="lane-hint">승인 · 방향 결정</text>
      <text x="40" y="236" class="lane-label">Inspector</text>
      <text x="40" y="248" class="lane-hint">진단 · 추천 · 검증</text>
      <text x="40" y="376" class="lane-label">원본 데이터</text>
      <text x="40" y="388" class="lane-hint">읽기 전용 입력</text>

      <!-- Connectors first: straight where aligned, rounded orthogonal otherwise. -->
      <path d="M 234 450 H 288 Q 296 450 296 442 V 310" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="432" y1="282" x2="484" y2="282" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="628" y1="282" x2="680" y2="282" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
      <path d="M 824 282 H 864 Q 872 282 872 290 V 170" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M 1016 142 H 1064 Q 1072 142 1072 150 V 242" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
      <path d="M 1148 310 H 1180 Q 1188 310 1188 318 V 442 H 1148" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- Process nodes -->
      <g>
        <rect x="90" y="414" width="144" height="72" rx="6" fill="#f0f1f3" stroke="#7a8399"/>
        <rect x="98" y="422" width="32" height="16" rx="2" fill="rgba(79,93,117,.12)"/>
        <text x="114" y="434" text-anchor="middle" class="step-label">01</text>
        <text x="106" y="458" class="node-title">원본 데이터 확인</text>
        <text x="106" y="474" class="node-sub">CSV · XLSX · read only</text>
      </g>
      <g>
        <rect x="288" y="246" width="144" height="72" rx="6" fill="#fff" stroke="#2d3142"/>
        <rect x="296" y="254" width="32" height="16" rx="2" fill="rgba(79,93,117,.12)"/>
        <text x="312" y="266" text-anchor="middle" class="step-label">02</text>
        <text x="304" y="290" class="node-title">구조 검사</text>
        <text x="304" y="306" class="node-sub">shape · dtype · missing</text>
      </g>
      <g>
        <rect x="484" y="246" width="144" height="72" rx="6" fill="rgba(235,108,54,.08)" stroke="#eb6c36" stroke-width="1.2"/>
        <rect x="492" y="254" width="32" height="16" rx="2" fill="rgba(235,108,54,.20)"/>
        <text x="508" y="266" text-anchor="middle" class="step-label" fill="#eb6c36">03</text>
        <text x="500" y="290" class="node-title">Key · Grain 진단</text>
        <text x="500" y="306" class="node-sub">후보와 위험을 제시</text>
      </g>
      <g>
        <rect x="680" y="246" width="144" height="72" rx="6" fill="#fff" stroke="#2d3142"/>
        <rect x="688" y="254" width="32" height="16" rx="2" fill="rgba(79,93,117,.12)"/>
        <text x="704" y="266" text-anchor="middle" class="step-label">04</text>
        <text x="696" y="290" class="node-title">추천 작업 계획</text>
        <text x="696" y="306" class="node-sub">변경 범위 · 검증 항목</text>
      </g>
      <g>
        <rect x="872" y="106" width="144" height="72" rx="6" fill="#f0f1f3" stroke="#7a8399"/>
        <rect x="880" y="114" width="32" height="16" rx="2" fill="rgba(79,93,117,.12)"/>
        <text x="896" y="126" text-anchor="middle" class="step-label">05</text>
        <text x="888" y="150" class="node-title">사용자 승인</text>
        <text x="888" y="166" class="node-sub">실행 여부를 결정</text>
      </g>
      <g>
        <rect x="1004" y="246" width="144" height="72" rx="6" fill="#fff" stroke="#2d3142"/>
        <rect x="1012" y="254" width="32" height="16" rx="2" fill="rgba(79,93,117,.12)"/>
        <text x="1028" y="266" text-anchor="middle" class="step-label">06</text>
        <text x="1020" y="290" class="node-title">결합 실행 · 검증</text>
        <text x="1020" y="306" class="node-sub">행 수 · 미매칭 · 중복</text>
      </g>
      <g>
        <rect x="1004" y="414" width="144" height="72" rx="6" fill="#f0f1f3" stroke="#7a8399"/>
        <text x="1020" y="446" class="node-title">원본은 보존</text>
        <text x="1020" y="462" class="node-sub">결과만 별도 저장</text>
      </g>

      <!-- Legend -->
      <line x1="40" y1="560" x2="1240" y2="560" stroke="rgba(45,49,66,.16)"/>
      <text x="44" y="584" class="legend-label">FOCUS</text>
      <rect x="112" y="573" width="16" height="16" rx="2" fill="rgba(235,108,54,.20)" stroke="#eb6c36"/>
      <text x="140" y="585" class="legend-text">핵심 진단 단계</text>
      <text x="300" y="584" class="legend-label">FLOW</text>
      <line x1="368" y1="581" x2="408" y2="581" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <text x="420" y="585" class="legend-text">검사·결과 흐름</text>
      <line x1="568" y1="581" x2="608" y2="581" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
      <text x="620" y="585" class="legend-text">승인 요청</text>
      <text x="820" y="584" class="legend-label">SAFETY</text>
      <text x="888" y="585" class="legend-text">자동 삭제·원본 수정 없음</text>
    </svg>
    <p class="note">이 예시는 설명용 프로세스입니다. Key·Grain 후보는 자동 확정하지 않고, 사용자의 승인 이후에만 결합을 실행합니다.</p>
  </main>
</body>
</html>
