<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="브라우저에서 GIF 편집 흐름을 시험하는 프로토타입입니다." />
    <title>GIF Editor | Test Lab</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/common.css" />
    <link rel="stylesheet" href="css/gif-editor.css" />
    <script src="js/common.js" defer></script>
    <script src="js/gif-editor.js" defer></script>
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="index.html">← KARINA / PROFILE</a>
      <span class="test-badge">TEST LAB</span>
    </header>
    <main class="editor-shell">
      <section class="editor-intro" aria-labelledby="editor-title">
        <p class="eyebrow">GIF EDITOR / PROTOTYPE</p>
        <h1 id="editor-title">GIF를 가볍게<br /><span>다듬어 보세요.</span></h1>
        <p>업로드부터 편집 옵션까지의 사용 흐름을 확인하는 테스트 화면입니다. 파일은 브라우저 안에서만 미리보기로 사용됩니다.</p>
      </section>

      <section class="editor-grid" aria-label="GIF 편집기 테스트">
        <div class="preview-panel">
          <label class="dropzone" for="gif-file" id="dropzone">
            <input id="gif-file" type="file" accept="image/gif,.gif" />
            <span class="dropzone-icon" aria-hidden="true">+</span>
            <strong>GIF 파일 선택</strong>
            <span>또는 이곳으로 파일을 끌어오세요 · 최대 20MB</span>
          </label>
          <div class="preview-frame" id="preview-frame" hidden>
            <img id="gif-preview" alt="업로드한 GIF 미리보기" />
          </div>
          <p class="file-status" id="file-status" role="status">아직 선택된 파일이 없습니다.</p>
        </div>

        <form class="control-panel" id="editor-controls">
          <div class="panel-heading"><p class="eyebrow">SETTINGS / 설정</p><p>테스트 UI</p></div>
          <fieldset disabled id="settings-fieldset">
            <label class="control-row" for="speed"><span>재생 속도</span><output id="speed-output">1×</output></label>
            <input id="speed" type="range" min="0.5" max="2" value="1" step="0.5" />
            <label class="control-row" for="scale"><span>내보내기 크기</span><output id="scale-output">원본</output></label>
            <select id="scale"><option value="100">원본 크기</option><option value="75">75%</option><option value="50">50%</option></select>
            <div class="trim-group"><span>구간 선택</span><div><label for="start-frame">시작 <input id="start-frame" type="number" min="0" value="0" /></label><label for="end-frame">끝 <input id="end-frame" type="number" min="1" value="0" /></label></div></div>
            <label class="checkbox-row" for="loop"><input id="loop" type="checkbox" checked /> 반복 재생</label>
          </fieldset>
          <button class="export-button" type="submit" disabled id="export-button">테스트 결과 만들기</button>
          <p class="notice" id="notice">GIF를 선택하면 설정 UI를 시험할 수 있습니다. 실제 인코딩과 다운로드는 다음 단계에서 연결합니다.</p>
        </form>
      </section>
    </main>
  </body>
</html>
